<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- 左钥匙：圆环在上，杆向下左展开，末端为齿 -->
  <g transform="translate(9,5.5) rotate(30)">
    <circle cx="0" cy="0" r="3"/>
    <line x1="0" y1="3" x2="0" y2="14"/>
    <line x1="0" y1="11" x2="4" y2="11"/>
    <line x1="0" y1="13" x2="3" y2="13"/>
  </g>
  <!-- 右钥匙：圆环在上，杆向下右展开，末端为齿 -->
  <g transform="translate(15,5.5) rotate(-30)">
    <circle cx="0" cy="0" r="3"/>
    <line x1="0" y1="3" x2="0" y2="14"/>
    <line x1="0" y1="11" x2="4" y2="11"/>
    <line x1="0" y1="13" x2="3" y2="13"/>
  </g>
</svg>
