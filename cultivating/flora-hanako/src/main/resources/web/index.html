<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanako</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="titlebar">
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="tb-toggle" id="tbToggleLeft" title="侧边栏">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            </button>
            <span class="tb-title">Hanako <small>有记忆的私人 AI 助理</small></span>
        </div>
        <button class="tb-toggle" id="tbToggleRight" title="书桌">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
    </div>

    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">会话</span>
                <div class="sidebar-actions">
                    <button class="icon-btn" id="newSessionBtn" title="新对话">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="icon-btn" id="settingsBtn" title="设置">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>
            </div>
            <div class="section-label">Agents</div>
            <div class="agent-list" id="agentList"></div>
            <div class="section-label">最近会话</div>
            <div class="session-list" id="sessionList"></div>
        </aside>

        <main class="main">
            <div class="chat-area" id="chatArea">
                <div class="messages" id="messages">
                    <div class="welcome" id="welcome">
                        <h1>Hanako</h1>
                        <p>一个有记忆、有性格的私人 AI 助理。</p>
                        <p>在下方输入，或点击「+」开始一段新对话。</p>
                    </div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-wrap">
                    <div class="slash-menu" id="slashMenu"></div>
                    <textarea id="input" rows="1" placeholder="和 Hanako 说点什么…（Enter 发送，Shift+Enter 换行，/ 唤起命令）"></textarea>
                    <div class="input-footer">
                        <span class="input-hint" id="modelHint"></span>
                        <button class="send-btn" id="sendBtn">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            发送
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <aside class="desk" id="desk">
        <div class="desk-header">
            <span>书桌 · 笺</span>
            <button class="icon-btn" id="deskClose" title="关闭">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="jian-list" id="jianList"></div>
        <div class="jian-add">
            <input id="jianInput" placeholder="写一张笺，Hanako 会主动读取并执行…">
            <button class="btn primary" id="jianAddBtn">添加</button>
        </div>
    </aside>

    <div class="overlay" id="settingsOverlay">
        <div class="modal" id="settingsModal"></div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="app.js"></script>
</body>
</html>
