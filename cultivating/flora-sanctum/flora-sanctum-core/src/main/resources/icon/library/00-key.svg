<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
    <!-- 与参考一致的圆形背景 -->
    <circle cx="12" cy="12" r="9" fill="#537D96"/>
    <!-- 与参考一致的白色描边风格 -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- 钥匙头（圆） -->
        <circle cx="8.5" cy="12" r="3.2"/>
        <!-- 钥匙柄（横向杆） -->
        <line x1="12" y1="12" x2="19.5" y2="12"/>
        <!-- 两根齿（竖直齿尖） -->
        <line x1="16.5" y1="12" x2="16.5" y2="15.5"/>
        <line x1="18.5" y1="12" x2="18.5" y2="14.2"/>
    </g>
</svg>